<!doctype html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню Доставки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .menu-category-title {
                @apply text-3xl md:text-4xl text-[#3b443d] font-bold tracking-tight text-center border-b-2 border-[#597e52]/40 mt-10 mb-6 pb-3;
            }
            .navelement {
                @apply tracking-tight text-lg text-[#3b443d] hover:text-[#597e52] font-semibold px-4 py-2 rounded-lg transition duration-200 ease-in-out hover:bg-[#597e52]/10;
            }
            .navelement.active {
                @apply text-[#597e52] bg-[#597e52]/10;
            }
            .menu-category-grid{
                @apply grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6
            }
            .menu-category-card {
                @apply bg-white border border-gray-200 rounded-xl shadow-sm transition-all duration-300 hover:shadow-lg hover:border-[#597e52]/30 overflow-hidden;
            }
            .menu-category-card-image {
                @apply w-full object-cover block h-48 sm:h-52 bg-gray-100;
            }
            .menu-category-card-content {
                @apply p-4 md:p-5;
            }
            .menu-category-card-text {
                @apply text-xl md:text-2xl font-bold mb-2 tracking-tight text-[#3b443d];
            }
            .menu-category-card-text-desc {
                @apply text-[#3b443d]/70 mb-4 text-sm leading-relaxed line-clamp-2;
            }

            .menu-category-card-parent {
                @apply flex flex-col justify-between gap-2 mt-auto pt-3 border-t border-gray-100;
            }
            .menu-category-card-parent-price {
                @apply text-2xl md:text-3xl font-bold tracking-tight text-[#597e52];
            }

            .quantity-controls {
                @apply flex items-center justify-between gap-2 bg-[#597e52]/10 rounded-full p-1;
            }

            .quantity-btn {
                @apply w-8 h-8 flex items-center justify-center rounded-full bg-[#597e52] text-white font-bold text-lg transition-all duration-200 hover:bg-[#4a6945] active:scale-95 shadow-sm hover:shadow-md;
            }

            .quantity-display {
                @apply min-w-[40px] text-center text-lg font-bold text-[#3b443d];
            }

            .add-to-cart-btn {
                @apply px-5 py-2.5 bg-[#597e52] text-white font-semibold rounded-full transition-all duration-200 hover:bg-[#4a6945] active:scale-95 shadow-sm hover:shadow-md text-sm;
            }

            .cart-notification {
                @apply fixed right-5 bg-white rounded-2xl shadow-xl backdrop-blur-md z-50 transition-all duration-300 ease-in-out opacity-0 translate-y-10 border border-gray-200;
                width: 360px;
                max-width: calc(100vw - 2.5rem);
            }

            .cart-notification.visible {
                @apply opacity-100 translate-y-0;
            }

            #notification-container {
                @apply fixed right-0 bottom-0 pointer-events-none z-50;
                padding-right: 1.25rem;
                padding-bottom: 1.25rem;
            }

            #notification-container .cart-notification {
                @apply pointer-events-auto mb-4;
                position: relative;
                right: 0;
                bottom: 0;
            }

            #floating-cart-btn {
                @apply fixed top-2 right-6 z-50;
            }

            #cart-btn:hover {
                @apply scale-110;
                transform: translateY(-2px);
            }

            #cart-count {
                @apply scale-0 transition-transform duration-200;
            }

            .cart-count-badge {
                @apply absolute -top-2 -right-2 bg-red-500 text-xs text-white font-bold rounded-full flex items-center justify-center transition-transform duration-200;
                min-width: 24px;
                height: 24px;
                padding: 0 6px;
                line-height: 1;
            }

            #language-switcher {
                @apply fixed top-2 left-6 z-50;
            }

            .lang-slider-container {
                @apply relative bg-white rounded-full p-1 shadow-lg flex items-center;
            }

            .lang-slider-bg {
                @apply absolute top-1 bottom-1 bg-[#597e52] rounded-full transition-all duration-300 ease-in-out;
                left: 4px;
                right: 50%;
            }

            .lang-slider-bg.uz {
                left: 50%;
                right: 4px;
            }

            .lang-option {
                @apply relative z-10 px-3 py-2 cursor-pointer transition-all duration-300 rounded-full flex items-center justify-center;
                width: 50%;
            }

            .lang-option img {
                @apply w-6 h-6 object-cover rounded-sm;
            }

            .lang-option.active {
                @apply text-white;
            }

            .lang-option:not(.active) {
                @apply text-[#3b443d];
            }

            .lang-option svg {
                @apply opacity-70 transition-opacity duration-300;
            }

            .lang-option.active svg {
                @apply opacity-100;
            }

            @media (max-width: 640px) {
                .cart-notification {
                    width: calc(100vw - 2.5rem);
                }
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-[#f4eee1] text-[#3b443d] font-sans">

<!-- === ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА === -->
<div id="language-switcher">
    <div class="lang-slider-container">
        <div id="lang-slider-bg" class="lang-slider-bg"></div>
        <div id="lang-ru" class="lang-option active" onclick="switchLanguage('ru')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" class="w-7 h-5">
                <path fill="#fff" d="M0 0h640v160H0z"/>
                <path fill="#0039a6" d="M0 160h640v160H0z"/>
                <path fill="#d52b1e" d="M0 320h640v160H0z"/>
            </svg>
        </div>
        <div id="lang-uz" class="lang-option" onclick="switchLanguage('uz')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" class="w-7 h-5">
                <path fill="#1eb53a" d="M0 320h640v160H0z"/>
                <path fill="#0099b5" d="M0 0h640v160H0z"/>
                <path fill="#ce1126" d="M0 153.6h640v172.8H0z"/>
                <path fill="#fff" d="M0 163.2h640v153.6H0z"/>
                <circle cx="134.4" cy="76.8" r="57.6" fill="#fff"/>
                <circle cx="153.6" cy="76.8" r="48" fill="#0099b5"/>
                <g fill="#fff" transform="matrix(1.92 0 0 1.92 261.1 122.9)">
                    <g id="e">
                        <g id="d">
                            <g id="c">
                                <g id="b">
                                    <path id="a" d="M0-6-1.9-.3 1 .7"/>
                                    <use xlink:href="#a" width="100%" height="100%" transform="scale(-1 1)"/>
                                </g>
                                <use xlink:href="#b" width="100%" height="100%" transform="rotate(72)"/>
                            </g>
                            <use xlink:href="#b" width="100%" height="100%" transform="rotate(-72)"/>
                            <use xlink:href="#c" width="100%" height="100%" transform="rotate(144)"/>
                        </g>
                        <use xlink:href="#d" width="100%" height="100%" y="-24"/>
                        <use xlink:href="#d" width="100%" height="100%" y="-48"/>
                    </g>
                    <use xlink:href="#e" width="100%" height="100%" x="24"/>
                    <use xlink:href="#e" width="100%" height="100%" x="48"/>
                    <use xlink:href="#d" width="100%" height="100%" x="-24"/>
                    <use xlink:href="#d" width="100%" height="100%" x="-48"/>
                    <use xlink:href="#d" width="100%" height="100%" x="-24" y="-24"/>
                    <use xlink:href="#d" width="100%" height="100%" x="-24" y="-48"/>
                </g>
            </svg>
        </div>
    </div>
</div>

<div class="container mx-auto p-4 sm:p-10 max-w-7xl">
    <h1 id="main-title" class="text-4xl md:text-5xl font-bold text-center mb-10 tracking-tight">Меню</h1>

    <!-- === НАВИГАЦИЯ === -->
    <div class="sticky top-0 z-10 bg-white shadow-md border-b border-gray-200">
        <div class="container mx-auto max-w-7xl px-4">
            <nav class="flex w-full justify-start md:justify-center overflow-x-auto overflow-y-none space-x-2 py-3 pr-20 md:pr-0">
            </nav>
        </div>
    </div>
</div>

<!-- === МОДАЛЬНОЕ ОКНО === -->
<div id="order-success-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center mx-4">
        <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <h2 id="modal-title" class="text-2xl font-bold mb-2">Заказ оформлен!</h2>
        <p id="modal-text" class="text-[#3b443d]/70 mb-6">Мы приняли ваш заказ. Ожидайте, скоро принесём!</p>
        <button id="close-order-modal" class="px-6 py-3 bg-[#597e52] text-white font-semibold rounded-lg hover:scale-105 transition">
            Окей
        </button>
    </div>
</div>

<!-- === УВЕДОМЛЕНИЯ === -->
<div id="notification-container"></div>

<!-- === КОРЗИНА === -->
<div id="floating-cart-btn" class="transition-all duration-300">
    <button id="cart-btn" class="relative w-14 h-14 bg-[#597e52] text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center group">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 576 512" fill="currentColor">
            <path d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"></path>
        </svg>
        <span id="cart-count" class="cart-count-badge">0</span>
    </button>
</div>

<script>
    // === ПЕРЕВОДЫ ===
    const translations = {
        ru: {
            title: 'Меню',
            addToCart: 'Добавить',
            addedToCart: 'Добавлено в корзину!',
            removedFromCart: 'Удалено из корзины!',
            cart: 'Корзина',
            orderPlaced: 'Заказ оформлен!',
            orderText: 'Мы приняли ваш заказ. Ожидайте, скоро принесём!',
            okay: 'Окей',
            currency: 'сўм'
        },
        uz: {
            title: 'Menyu',
            addToCart: 'Qo\'shish',
            addedToCart: 'Savatga qo\'shildi!',
            removedFromCart: 'Savatdan o\'chirildi!',
            cart: 'Savat',
            orderPlaced: 'Buyurtma qabul qilindi!',
            orderText: 'Biz sizning buyurtmangizni qabul qildik. Kutib turing!',
            okay: 'Yaxshi',
            currency: 'so\'m'
        }
    };

    let currentLang = localStorage.getItem('language') || 'ru';
    let menuData = null;

    // === ЛОКАЛИЗАЦИЯ ===
    function t(key) {
        return translations[currentLang][key] || translations.ru[key];
    }

    function getLocalized(obj, field) {
        return obj[`${field}_${currentLang}`] || obj[field] || obj[`${field}_ru`] || '';
    }

    // === ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ===
    function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('language', lang);

        const bg = document.getElementById('lang-slider-bg');
        const ru = document.getElementById('lang-ru');
        const uz = document.getElementById('lang-uz');

        if (lang === 'uz') {
            bg.classList.add('uz');
            ru.classList.remove('active');
            uz.classList.add('active');
        } else {
            bg.classList.remove('uz');
            ru.classList.add('active');
            uz.classList.remove('active');
        }

        updateAllTexts();
    }

    function updateAllTexts() {
        // Статичные тексты
        document.getElementById('main-title').textContent = t('title');
        document.getElementById('modal-title').textContent = t('orderPlaced');
        document.getElementById('modal-text').textContent = t('orderText');
        document.getElementById('close-order-modal').textContent = t('okay');

        // Кнопки "Добавить"
        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
            btn.textContent = t('addToCart');
        });

        // Обновляем меню
        if (menuData) renderMenu();

        // Обновляем уведомления (если есть)
        document.querySelectorAll('.cart-notification').forEach(notif => {
            const itemName = notif.querySelector('.text-sm').textContent;
            const isRemoval = notif.querySelector('span').textContent.includes('Удалено') || notif.querySelector('span').textContent.includes('o\'chirildi');
            notif.querySelector('span').textContent = isRemoval ? t('removedFromCart') : t('addedToCart');
            notif.querySelector('.text-sm').textContent = itemName;
            notif.querySelector('.text-base.font-bold').nextElementSibling.textContent = t('cart');
        });
    }

    // === ПРОВЕРКА ТОКЕНА ===
    function isTokenExpired(token) {
        if (!token) return true;
        const parts = token.split('.');
        if (parts.length !== 3) return true;
        try {
            const payload = JSON.parse(atob(parts[1]));
            const savedTime = localStorage.getItem('tableTokenSavedAt');
            if (!savedTime) return true;
            const tokenAgeMs = Date.now() - parseInt(savedTime, 10);
            if (tokenAgeMs > 24 * 60 * 60 * 1000) return true;
            return payload.exp < Math.floor(Date.now() / 1000);
        } catch (e) {
            return true;
        }
    }

    const tableNumber = localStorage.getItem('tableNumber');
    if (!tableNumber || isTokenExpired(tableNumber)) {
        localStorage.removeItem('tableNumber');
        window.location.href = './redirect.html';
    } else {

        // === КАРТОЧКА БЛЮДА ===
        function createMenuCard(item) {
            const card = document.createElement('div');
            card.className = 'menu-category-card';
            card.dataset.itemId = item.id;

            const img = document.createElement('img');
            img.alt = getLocalized(item, 'name');
            img.src = item.image || 'src/images/placeholder.jpg';
            img.className = 'menu-category-card-image';
            img.loading = 'lazy';
            card.appendChild(img);

            const content = document.createElement('div');
            content.className = 'menu-category-card-content';

            const title = document.createElement('h3');
            title.className = 'menu-category-card-text';
            title.textContent = getLocalized(item, 'name');
            content.appendChild(title);

            const desc = document.createElement('p');
            desc.className = 'menu-category-card-text-desc';
            desc.textContent = getLocalized(item, 'description');
            content.appendChild(desc);

            const parent = document.createElement('div');
            parent.className = 'menu-category-card-parent';

            const price = document.createElement('p');
            price.className = 'menu-category-card-parent-price';
            price.textContent = `${item.price} ${t('currency')}`;
            parent.appendChild(price);

            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItem = cart.find(i => i.id === item.id);
            const quantity = cartItem ? cartItem.quantity : 0;

            if (quantity > 0) {
                parent.appendChild(createQuantityControls(item, quantity));
            } else {
                const btn = document.createElement('button');
                btn.className = 'add-to-cart-btn';
                btn.textContent = t('addToCart');
                btn.onclick = () => updateCart(item, 1);
                parent.appendChild(btn);
            }

            content.appendChild(parent);
            card.appendChild(content);
            return card;
        }

        function createQuantityControls(item, quantity) {
            const div = document.createElement('div');
            div.className = 'quantity-controls';

            ['-', quantity, '+'].forEach((text, i) => {
                const el = document.createElement(i === 1 ? 'span' : 'button');
                el.className = i === 1 ? 'quantity-display' : 'quantity-btn';
                el.textContent = text;
                if (i !== 1) el.onclick = () => updateCart(item, i === 0 ? -1 : 1);
                div.appendChild(el);
            });

            return div;
        }

        // === КОРЗИНА ===
function updateCart(item, delta) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existing = cart.find(i => i.id === item.id);

    if (existing) {
        existing.quantity += delta;
        if (existing.quantity <= 0) {
            cart = cart.filter(i => i.id !== item.id);
            showNotification(item, true);
        } else {
            showNotification(item, false);
        }
    } else if (delta > 0) {
        // Сохраняем ВСЕ поля для RU/UZ
        const cartItem = {
            id: item.id,
            name_ru: item.name_ru,
            name_uz: item.name_uz,
            description_ru: item.description_ru,
            description_uz: item.description_uz,
            price: item.price,
            image: item.image,
            quantity: 1
        };
        cart.push(cartItem);
        showNotification(item);
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartButton();
    updateCardUI(item);
}
        function updateCardUI(item) {
            const card = document.querySelector(`[data-item-id="${item.id}"]`);
            if (!card) return;

            const parent = card.querySelector('.menu-category-card-parent');
            const old = parent.querySelector('.quantity-controls, .add-to-cart-btn');
            if (old) old.remove();

            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const qty = cart.find(i => i.id === item.id)?.quantity || 0;

            if (qty > 0) {
                parent.appendChild(createQuantityControls(item, qty));
            } else {
                const btn = document.createElement('button');
                btn.className = 'add-to-cart-btn';
                btn.textContent = t('addToCart');
                btn.onclick = () => updateCart(item, 1);
                parent.appendChild(btn);
            }
        }

function showNotification(item, isRemoval = false) {
    const container = document.getElementById('notification-container');
    const max = window.innerWidth < 768 ? 2 : 3;
    if (container.children.length >= max) {
        hideNotification(container.children[0].id);
    }

    const id = `notif-${Date.now()}`;
    const div = document.createElement('div');
    div.id = id;
    div.className = 'cart-notification';

    div.innerHTML = `
        <div class="flex items-center gap-3 p-4">
            <div class="flex-shrink-0">
                <div class="w-12 h-12 rounded-full bg-[#597e52]/15 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 576 512" fill="#597e52">
                        <path d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"></path>
                    </svg>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-base font-semibold text-[#3b443d]">${isRemoval ? t('removedFromCart') : t('addedToCart')}</span>
                    <button onclick="hideNotification('${id}')" class="ml-2">
                        <svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 384 512" class="fill-[#3b443d]/30 hover:fill-[#3b443d]">
                            <path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"></path>
                        </svg>
                    </button>
                </div>
                <div class="text-sm text-[#3b443d]/80 font-medium mb-2 truncate">${getLocalized(item, 'name')}</div>
                <div class="flex items-center justify-between">
                    <div class="text-base font-bold text-[#597e52]">${item.price} ${t('currency')}</div>
                    <button onclick="window.location.href='./cart.html'" class="py-1.5 px-3 bg-[#597e52] rounded-full flex items-center gap-1.5 text-white font-semibold text-xs hover:bg-[#4a6945]">
                        ${t('cart')}
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    `;

    container.appendChild(div);
    setTimeout(() => div.classList.add('visible'), 100);

    // Исправлено: используем правильную переменную id
    setTimeout(() => {
        hideNotification(id);
    }, 750);
}


        function hideNotification(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('visible');
                setTimeout(() => el.remove(), 300);
            }
        }

        // === ЗАГРУЗКА И ОТРИСОВКА МЕНЮ ===
        async function loadMenu() {
            try {
                const res = await fetch('/back/api/menu');
                if (!res.ok) throw new Error('Ошибка сети');
                menuData = await res.json();
                renderMenu();
            } catch (e) {
                console.error(e);
            }
        }

        function renderMenu() {
            const container = document.querySelector('.container.mx-auto.p-4');
            const nav = document.querySelector('nav');
            nav.innerHTML = '';

            // Удаляем старые секции
            container.querySelectorAll('section').forEach(s => s.remove());

            Object.entries(menuData.categories).forEach(([key, cat]) => {
                // Навигация
                const a = document.createElement('a');
                a.href = `#${key}`;
                a.className = 'navelement whitespace-nowrap';
                a.textContent = getLocalized(cat, 'name');
                nav.appendChild(a);

                // Секция
                const sec = document.createElement('section');
                sec.className = 'mb-12';
                sec.id = key;

                const h2 = document.createElement('h2');
                h2.className = 'menu-category-title';
                h2.textContent = getLocalized(cat, 'name');
                sec.appendChild(h2);

                const grid = document.createElement('div');
                grid.className = 'menu-category-grid';

                cat.items.forEach(item => {
                    grid.appendChild(createMenuCard(item));
                });

                sec.appendChild(grid);
                container.appendChild(sec);
            });

            updateCartButton();
        }

        function updateCartButton() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((s, i) => s + i.quantity, 0);
            const badge = document.getElementById('cart-count');
            badge.textContent = total;
            badge.classList.toggle('scale-0', total === 0);
            badge.classList.toggle('scale-100', total > 0);
            document.getElementById('cart-btn').onclick = () => window.location.href = './cart.html';
        }

        // === ИНИЦИАЛИЗАЦИЯ ===
        function init() {
            switchLanguage(currentLang);
            loadMenu();

            window.addEventListener('scroll', () => {
                const sections = document.querySelectorAll('section');
                const links = document.querySelectorAll('.navelement');
                let current = '';
                sections.forEach(s => {
                    if (window.pageYOffset >= s.offsetTop - 120) current = s.id;
                });
                links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === `#${current}`));
            });

            const params = new URLSearchParams(location.search);
            if (params.get('modal') === 'ordered') {
                const modal = document.getElementById('order-success-modal');
                modal.classList.remove('hidden');
                document.getElementById('close-order-modal').onclick = () => {
                    modal.classList.add('hidden');
                    history.replaceState({}, '', location.pathname);
                };
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    }
</script>
</body>
</html>
