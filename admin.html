<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .admin-tab-button {
                /* Адаптация: уменьшенный шрифт на мобильных, добавлено flex-shrink-0 для лучшего скролла */
                @apply tracking-tighter text-sm sm:text-xl text-gray-700 hover:text-[#597e52] font-medium p-2 rounded-md transition duration-150 ease-in-out border-x border-dashed whitespace-nowrap flex-shrink-0;
            }
            .admin-tab-button.active {
                @apply text-white bg-[#597e52] border-transparent;
            }
            .admin-sub-tab-button {
                /* Адаптация: уменьшенный шрифт на мобильных */
                @apply text-sm sm:text-lg text-gray-600 hover:text-[#597e52] font-medium p-2 rounded-md transition duration-150 ease-in-out border-b-2 border-transparent whitespace-nowrap;
            }
            .admin-sub-tab-button.active {
                @apply text-[#597e52] border-[#597e52];
            }
            .admin-content-title {
                /* Адаптация: уменьшенный шрифт и отступы на мобильных */
                @apply text-2xl sm:text-4xl text-black tracking-tighter border-b-[1.5px] mt-4 sm:mt-10 mb-3 sm:mb-5 pb-2 sm:pb-3;
            }
            .admin-card {
                /* Адаптация: уменьшенный паддинг на мобильных */
                @apply border border-gray-300 p-4 sm:p-6 rounded-lg shadow-sm;
            }
            .admin-input {
                /* Адаптация: использование адаптивных размеров шрифта */
                @apply w-full p-2 sm:p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#597e52] text-sm sm:text-base;
            }
            .admin-submit-button {
                /* Адаптация: использование адаптивных размеров шрифта */
                @apply bg-[#597e52] text-white p-2 sm:p-3 rounded-md hover:bg-green-700 transition duration-150 text-sm sm:text-base;
            }
            .message {
                @apply text-center text-xs sm:text-sm mt-2;
            }
            .success-message {
                @apply text-green-600;
            }
            .error-message {
                @apply text-red-500;
            }
            .payment-status-select {
                /* Адаптация: использование адаптивных размеров шрифта */
                @apply w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#597e52] text-xs sm:text-sm;
            }
            .pagination-button {
                /* Адаптация: уменьшенный размер кнопок пагинации на мобильных */
                @apply px-2 sm:px-3 py-1 mx-0.5 sm:mx-1 bg-gray-200 text-gray-700 rounded-md hover:bg-[#597e52] hover:text-white transition text-xs sm:text-base;
            }
            .pagination-button.active {
                @apply bg-[#597e52] text-white;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Arial', 'sans-serif'],
                    },
                },
            },
        }
        window.onload = function() {
            const tabsContainer = document.getElementById('admin-tabs');
            const contentContainer = document.getElementById('admin-content-container');
            const tabButtons = tabsContainer.querySelectorAll('.admin-tab-button');
            const tabContents = contentContainer.querySelectorAll('[data-tab-content]');
            const addDishForm = document.getElementById('add-dish-form');
            const addDishMessage = document.getElementById('add-dish-message');
            const addCategoryForm = document.getElementById('add-category-form');
            const removeCategoryForm = document.getElementById('remove-category-form');
            const categorySelect = document.getElementById('category-to-remove');
            const addCategoryMessage = document.getElementById('add-category-message');
            const removeCategoryMessage = document.getElementById('remove-category-message');
            const locationLinkForm = document.getElementById('location-link-form');
            const locationLinkMessage = document.getElementById('location-link-message');
            const locationLinkOutput = document.getElementById('location-link-output');
            const token = localStorage.getItem('token');
            let activeOrdersCurrentPage = 1;
            let activeOrdersLimit = 10;
            let completedOrdersCurrentPage = 1;
            let completedOrdersLimit = 10;
            let reviewsCurrentPage = 1;
            let reviewsLimit = 10;

            async function checkAuth() {
                try {
                    const response = await fetch('/back/api/orders', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) {
                        throw new Error('Invalid token');
                    }
                } catch (error) {
                    localStorage.removeItem('token');
                    window.location.href = './index.html';
                    return false;
                }
                return true;
            }
            if (!token) {
                window.location.href = './login.html';
                return;
            }
            (async () => {
                const authValid = await checkAuth();
                if (!authValid) return;
                window.removeDish = async function(dishId) {
                    if (!confirm('Вы уверены, что хотите удалить это блюдо?')) return;
                    try {
                        const formData = new FormData();
                        formData.append('dish-id', dishId);
                        const response = await fetch('/back/api/remove-dish', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` },
                            body: formData
                        });
                        const data = await response.json();
                        if (response.ok) {
                            loadDishes();
                            loadCategories();
                        } else {
                            alert(data.error || 'Ошибка удаления блюда');
                        }
                    } catch (error) {
                        console.error('Error removing dish:', error);
                        alert('Ошибка соединения с сервером');
                    }
                }
                window.takeOrder = async function(orderId) {
                    try {
                        const response = await fetch(`/back/api/take-order/${orderId}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        if (response.ok) {
                            const activeSubTab = document.querySelector('#orders-content .admin-sub-tab-button.active');
                            if (activeSubTab.dataset.subTab === 'active-orders') {
                                loadActiveOrders(activeOrdersCurrentPage, activeOrdersLimit);
                            } else {
                                loadCompletedOrders(completedOrdersCurrentPage, completedOrdersLimit);
                            }
                        } else {
                            alert(data.error || 'Ошибка взятия заказа');
                        }
                    } catch (error) {
                        console.error('Error taking order:', error);
                        alert('Ошибка соединения с сервером');
                    }
                }
                window.completeOrder = async function(orderId) {
                    try {
                        const response = await fetch(`/back/api/close-order/${orderId}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        if (response.ok) {
                            const activeSubTab = document.querySelector('#orders-content .admin-sub-tab-button.active');
                            if (activeSubTab.dataset.subTab === 'active-orders') {
                                loadActiveOrders(activeOrdersCurrentPage, activeOrdersLimit);
                            } else {
                                loadCompletedOrders(completedOrdersCurrentPage, completedOrdersLimit);
                            }
                        } else {
                            alert(data.error || 'Ошибка завершения заказа');
                        }
                    } catch (error) {
                        console.error('Error completing order:', error);
                        alert('Ошибка соединения с сервером');
                    }
                }
                window.cancelOrder = async function(orderId) {
                    if (!confirm('Вы уверены, что хотите отменить этот заказ?')) return;
                    try {
                        const response = await fetch(`/back/api/cancel-order/${orderId}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        if (response.ok) {
                            const activeSubTab = document.querySelector('#orders-content .admin-sub-tab-button.active');
                            if (activeSubTab.dataset.subTab === 'active-orders') {
                                loadActiveOrders(activeOrdersCurrentPage, activeOrdersLimit);
                            } else {
                                loadCompletedOrders(completedOrdersCurrentPage, completedOrdersLimit);
                            }
                        } else {
                            alert(data.error || 'Ошибка отмены заказа');
                        }
                    } catch (error) {
                        console.error('Error cancelling order:', error);
                        alert('Ошибка соединения с сервером');
                    }
                }
                async function updatePaymentStatus(orderId, paymentStatus, paymentComment) {
                    try {
                        const response = await fetch(`/back/api/update-payment-status/${orderId}`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ payment_status: paymentStatus, payment_comment: paymentComment })
                        });
                        const data = await response.json();
                        if (response.ok) {
                            const activeSubTab = document.querySelector('#orders-content .admin-sub-tab-button.active');
                            if (activeSubTab.dataset.subTab === 'active-orders') {
                                loadActiveOrders(activeOrdersCurrentPage, activeOrdersLimit);
                            } else {
                                loadCompletedOrders(completedOrdersCurrentPage, completedOrdersLimit);
                            }
                        } else {
                            alert(data.error || 'Ошибка обновления статуса оплаты');
                        }
                    } catch (error) {
                        console.error('Error updating payment status:', error);
                        alert('Ошибка соединения с сервером');
                    }
                }
                async function loadDishes() {
                    const container = document.getElementById('dishes-container');
                    if (!container) return;
                    try {
                        const token = localStorage.getItem('token');
                        const response = await fetch('/back/api/menu', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        const categories = data.categories;
                        container.innerHTML = '';
                        Object.entries(categories).forEach(([catKey, catObj]) => {
                            const catTitle = document.createElement('h3');
                            catTitle.className = 'text-xl sm:text-2xl font-bold mt-6 sm:mt-8 mb-3 sm:mb-4 text-[#597e52]';
                            catTitle.textContent = catObj.name;
                            container.appendChild(catTitle);
                            const grid = document.createElement('div');
                            /* Адаптация: на мобильных 1 колонка, на sm 2, на lg 3 */
                            grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6';
                            catObj.items.forEach(item => {
                                const card = document.createElement('div');
                                card.className = 'bg-white rounded-xl shadow-sm p-3 sm:p-4 border border-gray-200';
                                card.innerHTML = `
                                    <img src="${item.image}" alt="${item.name}" class="w-full h-32 sm:h-40 object-cover rounded-lg mb-2 sm:mb-3">
                                    <h4 class="font-semibold text-base sm:text-lg">${item.name}</h4>
                                    <p class="text-xs sm:text-sm text-[#3b443d]/70 mb-1 sm:mb-2">${item.description}</p>
                                    <p class="font-bold text-[#597e52] text-sm sm:text-base">${item.price} сум</p>
                                    <button class="mt-2 sm:mt-3 w-full bg-red-500 text-white py-1 sm:py-2 rounded-lg hover:bg-red-600 text-sm"
                                            onclick="removeDish(${item.id})">Удалить</button>
                                `;
                                grid.appendChild(card);
                            });
                            container.appendChild(grid);
                        });
                    } catch (e) {
                        console.error('Error loading dishes:', e);
                    }
                }
                async function loadCategories() {
                    const token = localStorage.getItem('token');
                    const response = await fetch('/back/api/categories', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    const addSelect = document.getElementById('dish-category');
                    const removeSelect = document.getElementById('category-to-remove');
                    addSelect.innerHTML = '<option value="" disabled selected>Выберите категорию...</option>';
                    removeSelect.innerHTML = '<option value="" disabled selected>Выберите категорию...</option>';
                    data.categories.forEach(cat => {
                        const optAdd = document.createElement('option');
                        optAdd.value = cat.value;
                        optAdd.textContent = cat.name;
                        addSelect.appendChild(optAdd);
                        const optRem = document.createElement('option');
                        optRem.value = cat.value;
                        optRem.textContent = cat.name;
                        removeSelect.appendChild(optRem);
                    });
                }
                async function loadActiveOrders(page = 1, limit = 10) {
                    activeOrdersCurrentPage = page;
                    activeOrdersLimit = limit;
                    try {
                        const response = await fetch(`/back/api/orders?page=${page}&limit=${limit}&status=new,in_progress`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        const ordersContainer = document.getElementById('active-orders-list');
                        ordersContainer.innerHTML = '';
                        const groupedOrders = {
                            'new': [],
                            'in_progress': []
                        };
                        data.orders.forEach(order => {
                            if (order.status === 'new' || order.status === 'in_progress') {
                                groupedOrders[order.status].push(order);
                            }
                        });
                        const statusTitles = {
                            'new': 'Новые Заказы',
                            'in_progress': 'Заказы в Процессе'
                        };
                        const statusColors = {
                            'new': 'text-green-600',
                            'in_progress': 'text-yellow-600',
                            'closed': 'text-red-600',
                            'cancelled': 'text-red-600'
                        };
                        const statusLabels = {
                            'new': 'Новый',
                            'in_progress': 'В процессе',
                            'closed': 'Закрыт',
                            'cancelled': 'Отменен'
                        };
                        ['new', 'in_progress'].forEach(status => {
                            if (groupedOrders[status].length > 0) {
                                const header = document.createElement('h3');
                                header.className = 'text-xl sm:text-2xl font-bold mt-6 sm:mt-8 mb-3 sm:mb-4 text-[#597e52]';
                                header.textContent = statusTitles[status];
                                ordersContainer.appendChild(header);
                                groupedOrders[status].forEach(order => {
                                    const orderDiv = document.createElement('div');
                                    orderDiv.className = 'p-3 sm:p-4 border rounded-md bg-gray-50 shadow-sm mb-4 grid grid-cols-1 lg:grid-cols-3 gap-4';
                                    orderDiv.innerHTML = `
                                        <div class="col-span-1 text-sm sm:text-base">
                                            <p class="font-bold text-base sm:text-lg mb-1">Заказ #${order.id}</p>
                                            <p>Столик: ${order.table_number}</p>
                                            <p>Время заказа: ${new Date(order.timestamp).toLocaleString('ru-RU')}</p>
                                            <p>Имя: ${order.user_name}</p>
                                            <p>Номер телефона: ${order.phone}</p>
                                            <p>Метод оплаты: ${order.payment_method === 'cash' ? 'Наличные/Карта' : order.payment_method.charAt(0).toUpperCase() + order.payment_method.slice(1)}</p>
                                            <p>Статус оплаты: <span class="${order.payment_status === 'Оплачен' ? 'text-green-600' : order.payment_status === 'Оплата при выезде' ? 'text-blue-600' : 'text-red-600'} font-medium">${order.payment_status}</span></p>
                                            ${order.payment_status === 'Оплата при выезде' && order.payment_comment ? `<p>Комментарий: ${order.payment_comment}</p>` : ''}
                                            <div class="mt-2">
                                                <select class="payment-status-select" data-order-id="${order.id}">
                                                    <option value="Оплачен" ${order.payment_status === 'Оплачен' ? 'selected' : ''}>Оплачен</option>
                                                    <option value="Не оплачен" ${order.payment_status === 'Не оплачен' ? 'selected' : ''}>Не оплачен</option>
                                                    <option value="Оплата при выезде" ${order.payment_status === 'Оплата при выезде' ? 'selected' : ''}>Оплата при выезде</option>
                                                </select>
                                                ${order.payment_status === 'Оплата при выезде' ? `
                                                    <input type="text" class="admin-input mt-2 payment-comment text-sm" placeholder="ФИО для оплаты при выезде" value="${order.payment_comment || ''}">
                                                ` : ''}
                                            </div>
                                            <p class="mb-2 mt-2">Статус заказа: <span class="${statusColors[order.status] || 'text-gray-600'} font-medium">${statusLabels[order.status] || order.status}</span></p>
                                            <div class="mt-4 space-x-2">
                                                <div class="flex flex-wrap gap-2">
                                                    ${order.status === 'new' ? `<button class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-700 text-sm" onclick="window.takeOrder(${order.id})">Взять заказ</button>` : ''}
                                                    ${order.status !== 'closed' && order.status !== 'cancelled' ? `<button class="bg-green-500 text-white p-2 rounded-md hover:bg-green-700 text-sm" onclick="window.completeOrder(${order.id})">Завершить заказ</button>` : ''}
                                                    ${order.status !== 'closed' && order.status !== 'cancelled' ? `<button class="bg-red-500 text-white p-2 rounded-md hover:bg-red-700 text-sm" onclick="window.cancelOrder(${order.id})">Отменить заказ</button>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-span-1 lg:col-span-2">
                                            <p class="font-semibold mb-1 text-base sm:text-lg">Состав заказа:</p>
                                            <ul class="list-disc list-inside ml-2 text-xs sm:text-sm text-gray-800 space-y-0.5">
                                                ${order.items.map(item => `<li>${item.name} x ${item.quantity} - ${item.price * item.quantity} сум</li>`).join('')}
                                            </ul>
                                        </div>
                                    `;
                                    ordersContainer.appendChild(orderDiv);
                                    const select = orderDiv.querySelector('.payment-status-select');
                                    const commentInput = orderDiv.querySelector('.payment-comment');
                                    select.addEventListener('change', async () => {
                                        const paymentStatus = select.value;
                                        let paymentComment = '';
                                        if (paymentStatus === 'Оплата при выезде') {
                                            if (!commentInput) {
                                                const input = document.createElement('input');
                                                input.type = 'text';
                                                input.className = 'admin-input mt-2 payment-comment text-sm';
                                                input.placeholder = 'ФИО для оплаты при выезде';
                                                select.parentElement.appendChild(input);
                                                input.addEventListener('change', () => updatePaymentStatus(order.id, paymentStatus, input.value));
                                                return;
                                            }
                                            paymentComment = commentInput.value;
                                        } else if (commentInput) {
                                            commentInput.remove();
                                        }
                                        await updatePaymentStatus(order.id, paymentStatus, paymentComment);
                                    });
                                    if (commentInput) {
                                        commentInput.addEventListener('change', () => updatePaymentStatus(order.id, select.value, commentInput.value));
                                    }
                                });
                            }
                        });
                        renderPagination('active-orders-pagination', data.total, data.page, data.limit, loadActiveOrders);
                    } catch (error) {
                        console.error('Error loading active orders:', error);
                    }
                }
                async function loadCompletedOrders(page = 1, limit = 10) {
                    completedOrdersCurrentPage = page;
                    completedOrdersLimit = limit;
                    try {
                        const response = await fetch(`/back/api/orders?page=${page}&limit=${limit}&status=closed,cancelled`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        const ordersContainer = document.getElementById('completed-orders-list');
                        ordersContainer.innerHTML = '';
                        const groupedOrders = {
                            'closed': [],
                            'cancelled': []
                        };
                        data.orders.forEach(order => {
                            if (order.status === 'closed' || order.status === 'cancelled') {
                                groupedOrders[order.status].push(order);
                            }
                        });
                        const statusTitles = {
                            'closed': 'Завершенные Заказы',
                            'cancelled': 'Отмененные Заказы'
                        };
                        const statusColors = {
                            'new': 'text-green-600',
                            'in_progress': 'text-yellow-600',
                            'closed': 'text-red-600',
                            'cancelled': 'text-red-600'
                        };
                        const statusLabels = {
                            'new': 'Новый',
                            'in_progress': 'В процессе',
                            'closed': 'Закрыт',
                            'cancelled': 'Отменен'
                        };
                        ['closed', 'cancelled'].forEach(status => {
                            if (groupedOrders[status].length > 0) {
                                const header = document.createElement('h3');
                                header.className = 'text-xl sm:text-2xl font-bold mt-6 sm:mt-8 mb-3 sm:mb-4 text-[#597e52]';
                                header.textContent = statusTitles[status];
                                ordersContainer.appendChild(header);
                                groupedOrders[status].forEach(order => {
                                    const orderDiv = document.createElement('div');
                                    orderDiv.className = 'p-3 sm:p-4 border rounded-md bg-gray-50 shadow-sm mb-4 grid grid-cols-1 lg:grid-cols-3 gap-4';
                                    orderDiv.innerHTML = `
                                        <div class="col-span-1 text-sm sm:text-base">
                                            <p class="font-bold text-base sm:text-lg mb-1">Заказ #${order.id}</p>
                                            <p>Столик: ${order.table_number}</p>
                                            <p>Время заказа: ${new Date(order.timestamp).toLocaleString('ru-RU')}</p>
                                            <p>Имя: ${order.user_name}</p>
                                            <p>Номер телефона: ${order.phone}</p>
                                            <p>Метод оплаты: ${order.payment_method === 'cash' ? 'Наличные/Карта' : order.payment_method.charAt(0).toUpperCase() + order.payment_method.slice(1)}</p>
                                            <p>Статус оплаты: <span class="${order.payment_status === 'Оплачен' ? 'text-green-600' : order.payment_status === 'Оплата при выезде' ? 'text-blue-600' : 'text-red-600'} font-medium">${order.payment_status}</span></p>
                                            ${order.payment_status === 'Оплата при выезде' && order.payment_comment ? `<p>Комментарий: ${order.payment_comment}</p>` : ''}
                                            <div class="mt-2">
                                                <select class="payment-status-select" data-order-id="${order.id}">
                                                    <option value="Оплачен" ${order.payment_status === 'Оплачен' ? 'selected' : ''}>Оплачен</option>
                                                    <option value="Не оплачен" ${order.payment_status === 'Не оплачен' ? 'selected' : ''}>Не оплачен</option>
                                                    <option value="Оплата при выезде" ${order.payment_status === 'Оплата при выезде' ? 'selected' : ''}>Оплата при выезде</option>
                                                </select>
                                                ${order.payment_status === 'Оплата при выезде' ? `
                                                    <input type="text" class="admin-input mt-2 payment-comment text-sm" placeholder="ФИО для оплаты при выезде" value="${order.payment_comment || ''}">
                                                ` : ''}
                                            </div>
                                            <p class="mb-2 mt-2">Статус заказа: <span class="${statusColors[order.status] || 'text-gray-600'} font-medium">${statusLabels[order.status] || order.status}</span></p>
                                            <div class="mt-4 space-x-2">
                                                <div class="flex flex-wrap gap-2">
                                                    ${order.status === 'new' ? `<button class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-700 text-sm" onclick="window.takeOrder(${order.id})">Взять заказ</button>` : ''}
                                                    ${order.status !== 'closed' && order.status !== 'cancelled' ? `<button class="bg-green-500 text-white p-2 rounded-md hover:bg-green-700 text-sm" onclick="window.completeOrder(${order.id})">Завершить заказ</button>` : ''}
                                                    ${order.status !== 'closed' && order.status !== 'cancelled' ? `<button class="bg-red-500 text-white p-2 rounded-md hover:bg-red-700 text-sm" onclick="window.cancelOrder(${order.id})">Отменить заказ</button>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-span-1 lg:col-span-2">
                                            <p class="font-semibold mb-1 text-base sm:text-lg">Состав заказа:</p>
                                            <ul class="list-disc list-inside ml-2 text-xs sm:text-sm text-gray-800 space-y-0.5">
                                                ${order.items.map(item => `<li>${item.name} x ${item.quantity} - ${item.price * item.quantity} сум</li>`).join('')}
                                            </ul>
                                        </div>
                                    `;
                                    ordersContainer.appendChild(orderDiv);
                                    const select = orderDiv.querySelector('.payment-status-select');

                        <h3 class="text-xl sm:text-2xl font-semibold text-gray-800 mb-3 sm:mb-4">Генерация Ссылки для Локации</h3>
                        <form id="location-link-form" class="space-y-4">
                            <div>
                                <label for="location-selection" class="block text-sm font-medium text-gray-700 mb-1">Выберите локацию</label>
                                <select id="location-selection" name="location" class="admin-input" required>
                                    <option value="" disabled selected>Выберите из списка...</option>
                                    <optgroup label="Ресторан (Столики)">
                                        <option value="Столик 1">Столик 1</option>
                                        <option value="Столик 2">Столик 2</option>
                                        <option value="Столик 3">Столик 3</option>
                                        <option value="Столик 4">Столик 4</option>
                                        <option value="Столик 5">Столик 5</option>
                                        <option value="Столик 6">Столик 6</option>
                                        <option value="Столик 7">Столик 7</option>
                                        <option value="Столик 8">Столик 8</option>
                                    </optgroup>
                                    <optgroup label="Зона 'Азия' (Топчаны)">
                                        <option value="Азия 1">Азия 1</option>
                                        <option value="Азия 2">Азия 2</option>
                                        <option value="Азия 3">Азия 3</option>
                                        <option value="Азия 4">Азия 4</option>
                                        <option value="Азия 5">Азия 5</option>
                                        <option value="Азия 6">Азия 6</option>
                                    </optgroup>
                                    <optgroup label="Зона 'Восток' (Топчаны)">
                                        <option value="Восток 1">Восток 1</option>
                                        <option value="Восток 2">Восток 2</option>
                                        <option value="Восток 3">Восток 3</option>
                                        <option value="Восток 4">Восток 4</option>
                                        <option value="Восток 5">Восток 5</option>
                                        <option value="Восток 6">Восток 6</option>
                                        <option value="Восток 7">Восток 7</option>
                                        <option value="Восток 8">Восток 8</option>
                                    </optgroup>
                                    <optgroup label="Отдельные домики">
                                        <option value="Беседка 1">Беседка 1</option>
                                        <option value="Беседка 2">Беседка 2</option>
                                        <option value="Типи">Типи</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div>
                                <label for="location-link-output" class="block text-sm font-medium text-gray-700 mb-1">Сгенерированная Ссылка</label>
                                <a id="location-link-output" href="" target="_blank" class="text-blue-600 underline break-all"></a>
                            </div>
                            <div class="qr-code-parent flex flex-col sm:flex-row items-center hidden">
                                <img class="qr-code h-32 sm:h-40" src="" alt="qr-code">
                                <button type="button" id="download-qr" class="max-w-xs sm:max-w-40 m-4 sm:mt-16 p-2 rounded-md w-full h-10 border bg-[#597e52] text-white">Скачать</button>
                            </div>
                            <button type="submit" class="admin-submit-button w-full">Сгенерировать Ссылку</button>
                            <div id="location-link-message" class="message"></div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <section id="reviews-content" data-tab-content class="space-y-4 sm:space-y-6 hidden">
            <h2 class="admin-content-title">Отзывы</h2>
            <div class="admin-card space-y-4">
                <div id="reviews-list" class="space-y-4"></div>
                <div id="reviews-pagination" class="flex justify-center mt-4"></div>
            </div>
        </section>
    </div>
    <button id="logout" class="admin-submit-button mt-4 sm:mt-6 w-full sm:w-auto">Выйти</button>
</div>
